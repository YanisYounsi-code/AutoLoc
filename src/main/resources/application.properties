spring.application.name=autoloc-api

# ---------------------------------------------------------------
# Base de donnees
# En local : MySQL de XAMPP. Avec Docker, SPRING_DATASOURCE_URL remplace l'URL.
# Les identifiants viennent de variables d'environnement (jamais ecrits dans Git).
# ---------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Pool de connexions HikariCP : 10 connexions reutilisees au lieu d'en ouvrir une par requete
spring.datasource.hikari.maximum-pool-size=10

# ---------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
# La connexion a la base est rendue des la fin du service, pas a la fin de la requete HTTP
spring.jpa.open-in-view=false
# Workshop 1 : le SQL genere est affiche par le logger org.hibernate.SQL (niveau DEBUG, plus bas).
# show-sql reste a false, sinon chaque requete serait ecrite deux fois dans la console.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------------
# Cache (Caffeine, en memoire) : liste des agences
# ---------------------------------------------------------------
spring.cache.cache-names=agences
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=10m,recordStats

# ---------------------------------------------------------------
# Les 2 comptes (Spring Security, en memoire). Mots de passe lus dans des variables
# d'environnement ; la valeur apres ":" est un defaut pour la salle de TP uniquement.
# Le compte USER porte l'e-mail du client qui loue (Camille Martin dans les donnees de demo).
# ---------------------------------------------------------------
autoloc.securite.admin.identifiant=admin@autoloc.fr
autoloc.securite.admin.mot-de-passe=${ADMIN_PASSWORD:admin123}
autoloc.securite.user.identifiant=user@autoloc.fr
autoloc.securite.user.mot-de-passe=${USER_PASSWORD:user123}

# Donnees de demonstration inserees au premier demarrage (base vide)
autoloc.demo.enabled=true

# ---------------------------------------------------------------
# Actuator : sante et metriques de l'application
# ---------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN

# ---------------------------------------------------------------
# Swagger UI : http://localhost:8080/swagger-ui.html
# ---------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
# Swagger ne documente que l'API REST, pas les pages web
springdoc.paths-to-match=/api/**

# Logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.fr.ece.autoloc=INFO
