# Profil "dev" : ajoute le nombre de requetes SQL par appel (le SQL lui-meme est deja affiche par defaut).
# Activation dans IntelliJ : Run > Edit Configurations > Active profiles : dev

# Statistiques Hibernate : "N JDBC statements executed" a chaque requete HTTP.
# Ideal pour montrer le probleme N+1 et sa correction.
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=INFO
