# Profil "test" : base H2 en memoire, recreee a chaque lancement. MySQL n'est pas necessaire.
spring.datasource.url=jdbc:h2:mem:autoloc;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
autoloc.demo.enabled=false

# Mots de passe fixes pour les tests (independants des variables d environnement)
autoloc.securite.admin.mot-de-passe=admin123
autoloc.securite.user.mot-de-passe=user123
